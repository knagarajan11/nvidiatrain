lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  exclude_modules:
    - "vision_model" # freeze vision backbone
    - "mm_projector" # typically frozen during VLM language-centric PEFT
  batch_size: 4
  learning_rate: 2e-4
  epochs: 3
